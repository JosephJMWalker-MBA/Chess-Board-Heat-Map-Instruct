[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chessheat"
version = "0.1.0"
description = "ChessHeat - Square-level consequence and leverage visualization system."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "chess>=1.10.0",
    "pydantic>=2.0.0",
    "zstandard>=0.22.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chessheat"]


[project.optional-dependencies]
ml = [
    "torch==2.13.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
chessheat = "chessheat.cli:main"
